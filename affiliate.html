<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Apykart Affiliate Program — Earn by Sharing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#2563eb;--primary-dark:#1d4ed8;--primary-light:#eff6ff;--primary-mid:#dbeafe;
  --accent:#f97316;--accent-dark:#ea580c;
  --money:#16a34a;--money-dark:#166534;--money-light:#f0fdf4;--money-mid:#bbf7d0;
  --danger:#dc2626;--warn:#d97706;
  --bg:#f6f8fb;--card:#fff;--text:#0f172a;--text2:#4b5563;--text3:#9ca3af;
  --border:#e8eaf0;--shadow:0 2px 12px rgba(15,23,42,.06);--shadow2:0 1px 4px rgba(15,23,42,.05);
  --radius:14px;--radius-sm:10px;--radius-lg:18px;
  --font-head:'Plus Jakarta Sans',system-ui,sans-serif;--font-body:'Inter',system-ui,sans-serif;
}
html,body{height:100%;background:var(--bg);font-family:var(--font-body);color:var(--text);-webkit-font-smoothing:antialiased}
button{font-family:var(--font-body);cursor:pointer;border:none;background:none}
input,textarea,select{font-family:var(--font-body)}
img{display:block;max-width:100%}
#app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;box-shadow:0 0 80px rgba(0,0,0,.08)}

/* ── SPLASH ── */
#splash{position:fixed;inset:0;z-index:999;background:radial-gradient(ellipse at 50% 30%,#0F2760,#081638);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .4s ease,visibility .4s ease}
#splash.hidden{opacity:0;visibility:hidden;pointer-events:none}
.splash-word{font-family:var(--font-head);font-size:28px;font-weight:900;color:#fff;letter-spacing:-.5px}
.splash-word span{color:var(--money)}
.splash-sub{font-size:11px;color:rgba(255,255,255,.55);letter-spacing:2px;text-transform:uppercase;font-weight:700}

/* ── GATE (sign-in / loading) ── */
.gate-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;text-align:center;gap:18px}
.gate-badge{width:78px;height:78px;border-radius:22px;background:linear-gradient(135deg,var(--money),#0f9b57);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 28px rgba(22,163,74,.35)}
.gate-title{font-family:var(--font-head);font-size:22px;font-weight:900;color:var(--text);letter-spacing:-.3px}
.gate-sub{font-size:13.5px;color:var(--text2);line-height:1.6;max-width:320px}
.gate-perks{display:flex;flex-direction:column;gap:10px;width:100%;max-width:320px;margin-top:6px}
.gate-perk{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--border);border-radius:12px;padding:11px 14px;text-align:left}
.gate-perk-icon{font-size:20px;flex-shrink:0}
.gate-perk-text{font-size:12.5px;font-weight:700;color:var(--text)}
.btn-google{margin-top:8px;width:100%;max-width:320px;background:#fff;color:var(--text);font-size:14px;font-weight:800;padding:14px;border-radius:14px;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:var(--shadow);cursor:pointer}
.btn-google:active{transform:scale(.98)}
.gate-note{font-size:11px;color:var(--text3);max-width:300px;line-height:1.5}

/* ── HEADER ── */
.aff-header{height:64px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:10px;position:sticky;top:0;z-index:50}
.aff-header-title{font-family:var(--font-head);font-size:16px;font-weight:800;color:var(--text);flex:1}
.aff-header-title span{color:var(--money)}
.aff-avatar{width:34px;height:34px;border-radius:10px;overflow:hidden;background:var(--primary-light);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.aff-avatar img{width:100%;height:100%;object-fit:cover}
.aff-signout{width:34px;height:34px;border-radius:10px;background:#fef2f2;display:flex;align-items:center;justify-content:center;color:var(--danger);cursor:pointer;flex-shrink:0}

/* ── FORM (registration) ── */
.form-wrap{padding:18px 16px 40px}
.form-hero{background:linear-gradient(135deg,#0F2760,#152F73);border-radius:var(--radius-lg);padding:20px 18px;margin-bottom:16px}
.form-hero-title{font-family:var(--font-head);font-size:18px;font-weight:800;color:#fff;margin-bottom:4px}
.form-hero-sub{font-size:12.5px;color:rgba(255,255,255,.65);line-height:1.6}
.form-card{background:#fff;border-radius:var(--radius);border:1px solid var(--border);padding:16px;margin-bottom:12px;box-shadow:var(--shadow2)}
.form-card-title{font-size:12px;font-weight:800;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
.f-group{margin-bottom:12px}
.f-group:last-child{margin-bottom:0}
.f-label{font-size:12px;font-weight:700;color:var(--text2);margin-bottom:5px;display:block}
.f-input{width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;padding:12px 13px;font-size:13.5px;font-weight:500;color:var(--text);outline:none}
.f-input:focus{border-color:var(--primary);background:#fff}
.f-row{display:flex;gap:8px}
.f-row .f-group{flex:1}
.pay-toggle{display:flex;gap:8px;margin-bottom:12px}
.pay-toggle-btn{flex:1;padding:10px;border-radius:10px;border:1.5px solid var(--border);font-size:12.5px;font-weight:700;color:var(--text2);text-align:center}
.pay-toggle-btn.active{border-color:var(--money);background:var(--money-light);color:var(--money-dark)}
.btn-submit-form{width:100%;background:linear-gradient(135deg,var(--money),#0f9b57);color:#fff;font-size:14px;font-weight:800;padding:15px;border-radius:12px;box-shadow:0 6px 20px rgba(22,163,74,.3);margin-top:4px}
.f-terms{font-size:11px;color:var(--text3);text-align:center;margin-top:10px;line-height:1.6}

/* ── DASHBOARD ── */
.dash{padding:14px 14px 40px}
.earn-hero{background:linear-gradient(135deg,#0F2760 0%,#0B1F4D 55%,#081638 100%);border-radius:var(--radius-lg);padding:20px 18px;position:relative;overflow:hidden;margin-bottom:12px}
.earn-hero::before{content:'';position:absolute;top:-30px;right:-30px;width:130px;height:130px;background:rgba(22,163,74,.18);border-radius:50%}
.earn-hero-label{font-size:11px;font-weight:700;color:rgba(255,255,255,.55);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px;position:relative;z-index:1}
.earn-hero-amt{font-family:var(--font-head);font-size:34px;font-weight:900;color:#4ade80;letter-spacing:-.5px;position:relative;z-index:1}
.earn-hero-sub{font-size:12px;color:rgba(255,255,255,.55);margin-top:4px;position:relative;z-index:1}
.earn-hero-btn{margin-top:14px;background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.25);color:#fff;font-size:12.5px;font-weight:800;padding:11px 16px;border-radius:11px;position:relative;z-index:1;width:100%}

.stats-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
.stat-card{background:#fff;border:1.5px solid var(--border);border-radius:12px;padding:12px 8px;text-align:center}
.stat-val{font-family:var(--font-head);font-size:17px;font-weight:800;color:var(--text)}
.stat-label{font-size:9.5px;color:var(--text3);font-weight:700;margin-top:2px;text-transform:uppercase;letter-spacing:.3px}

.section-h{font-family:var(--font-head);font-size:14px;font-weight:800;color:var(--text);margin:16px 2px 10px;display:flex;align-items:center;gap:6px}

.ref-link-card{background:#fff;border:1.5px solid var(--money-mid);border-radius:var(--radius);padding:14px;margin-bottom:6px}
.ref-link-title{font-size:12.5px;font-weight:800;color:var(--money-dark);margin-bottom:8px}
.ref-link-box{display:flex;align-items:center;gap:8px;background:var(--money-light);border:1px dashed var(--money-mid);border-radius:9px;padding:9px 11px}
.ref-link-text{flex:1;font-size:11.5px;color:var(--text2);font-weight:600;word-break:break-all}
.ref-link-copy{background:var(--money);color:#fff;font-size:11px;font-weight:800;padding:6px 12px;border-radius:7px;flex-shrink:0}
.ref-share-row{display:flex;gap:8px;margin-top:9px}
.ref-share-btn{flex:1;padding:10px;border-radius:9px;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:5px}

.prod-search{width:100%;background:#fff;border:1.5px solid var(--border);border-radius:11px;padding:11px 14px;font-size:13px;font-weight:500;color:var(--text);outline:none;margin-bottom:10px}
.prod-row{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--border);border-radius:12px;padding:10px;margin-bottom:8px}
.prod-thumb{width:48px;height:48px;border-radius:8px;background:var(--bg);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:20px}
.prod-thumb img{width:100%;height:100%;object-fit:contain}
.prod-info{flex:1;min-width:0}
.prod-name{font-size:12.5px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prod-price{font-size:12px;color:var(--money-dark);font-weight:800;margin-top:2px}
.prod-commission{font-size:10px;color:var(--text3);font-weight:600}
.prod-link-btn{background:var(--primary-light);color:var(--primary);font-size:11px;font-weight:800;padding:8px 12px;border-radius:8px;flex-shrink:0}

.earn-item{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--border);border-radius:12px;padding:11px 13px;margin-bottom:8px}
.earn-item-icon{width:34px;height:34px;border-radius:9px;background:var(--money-light);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.earn-item-info{flex:1;min-width:0}
.earn-item-title{font-size:12px;font-weight:700;color:var(--text)}
.earn-item-sub{font-size:10.5px;color:var(--text3);font-weight:500;margin-top:1px}
.earn-item-amt{font-size:13px;font-weight:800;color:var(--money-dark);flex-shrink:0}
.pill{font-size:9.5px;font-weight:800;padding:2px 7px;border-radius:99px}
.pill-pending{background:#fef3c7;color:#92400e}
.pill-paid{background:#dcfce7;color:#166534}

.empty-box{display:flex;flex-direction:column;align-items:center;gap:8px;padding:34px 16px;text-align:center;background:#fff;border:1.5px dashed var(--border);border-radius:var(--radius)}
.empty-icon{font-size:38px}
.empty-title{font-size:13px;font-weight:800;color:var(--text)}
.empty-sub{font-size:11.5px;color:var(--text3);line-height:1.5}

.withdraw-btn{width:100%;background:linear-gradient(135deg,var(--money),#0f9b57);color:#fff;font-size:13.5px;font-weight:800;padding:14px;border-radius:12px;box-shadow:0 4px 16px rgba(22,163,74,.3);margin-top:4px}

.info-note{background:#eff6ff;border:1.5px solid var(--primary-mid);border-radius:12px;padding:13px 14px;margin-top:16px}
.info-note-title{font-size:12px;font-weight:800;color:var(--primary-dark);margin-bottom:6px}
.info-note-body{font-size:11.5px;color:var(--text2);line-height:1.7}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:900;display:flex;align-items:flex-end;justify-content:center}
.modal-sheet{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;padding-bottom:24px}
.modal-handle{width:36px;height:3px;background:var(--border);border-radius:99px;margin:11px auto 0}
.modal-head{padding:14px 18px 8px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.modal-title{font-family:var(--font-head);font-size:15px;font-weight:800;color:var(--text)}
.modal-close{font-size:18px;color:var(--text3);cursor:pointer;padding:4px}
.modal-body{padding:16px 18px}

.toast-wrap{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;flex-direction:column;gap:7px;width:calc(100% - 28px);max-width:440px}
.toast{background:#fff;border-radius:10px;padding:11px 14px;box-shadow:0 8px 24px rgba(0,0,0,.15);font-size:12.5px;font-weight:700;color:var(--text);border-left:3px solid var(--primary);animation:toastIn .25s ease}
.toast.success{border-color:var(--money)}.toast.warn{border-color:var(--accent)}
@keyframes toastIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
</style>
</head>
<body>

<div id="splash">
  <div class="splash-word">Apykart <span>Affiliate</span></div>
  <div class="splash-sub">Loading your dashboard…</div>
</div>

<div id="app"></div>
<div id="toastWrap" class="toast-wrap"></div>
<div id="modalRoot"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, signInWithPopup, signInWithRedirect, getRedirectResult, GoogleAuthProvider, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, doc, setDoc, updateDoc, getDoc, addDoc, getDocs,
  collection, onSnapshot, query, where, orderBy, limit, serverTimestamp, increment
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ─── Same Firebase project as index.html ─── */
const firebaseConfig = {
  apiKey: "AIzaSyB9wwF-K1AwN8xlrppiKELDXx0NxqJknbc",
  authDomain: "apykart-916.firebaseapp.com",
  projectId: "apykart-916",
  storageBucket: "apykart-916.firebasestorage.app",
  messagingSenderId: "787741109597",
  appId: "1:787741109597:web:883a5eee5e9bb9602f8cb4"
};
const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);
const provider = new GoogleAuthProvider();

const SITE_URL = "https://apykart.vercel.app";
const COMMISSION_RATE = 0.05; // 5% per sale — keep in sync with index.html's AFFILIATE_COMMISSION_RATE

let currentUser  = null;
let affiliate    = null;   // affiliates/{uid} doc data, null if not registered yet
let earnings     = [];
let withdrawals  = [];
let products     = [];
let _unsubs      = [];

const $ = sel => document.querySelector(sel);
const appEl = document.getElementById('app');

/* ─── TOAST ─── */
function toast(msg, type='success') {
  const wrap = document.getElementById('toastWrap');
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  wrap.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; setTimeout(()=>t.remove(),250); }, 2600);
}

/* ─── AUTH ─── */
getRedirectResult(auth).catch(()=>{});
onAuthStateChanged(auth, async (user) => {
  currentUser = user;
  cleanupListeners();
  if (!user) { renderGate(); return; }
  await loadAffiliateProfile();
});

function signIn() {
  signInWithPopup(auth, provider).catch(err => {
    if (['auth/popup-blocked','auth/operation-not-supported-in-this-environment'].includes(err.code)) {
      signInWithRedirect(auth, provider);
    } else {
      toast('Sign-in failed: ' + err.code, 'warn');
    }
  });
}
function logout() { signOut(auth).then(()=>{ affiliate=null; renderGate(); }); }

/* ─── LOAD / CREATE AFFILIATE PROFILE ─── */
async function loadAffiliateProfile() {
  const ref = doc(db, 'affiliates', currentUser.uid);
  const snap = await getDoc(ref).catch(()=>null);
  if (snap && snap.exists()) {
    affiliate = snap.data();
    startDashboardListeners();
    renderDashboard();
  } else {
    affiliate = null;
    renderRegisterForm();
  }
}

async function submitRegistration() {
  const name  = $('#regName')?.value.trim();
  const phone = $('#regPhone')?.value.trim().replace(/\D/g,'');
  const email = $('#regEmail')?.value.trim();
  const method = window._payMethod || 'upi';
  const upi   = $('#regUpi')?.value.trim() || '';
  const bank  = {
    name: $('#regBankName')?.value.trim() || '',
    acc:  $('#regBankAcc')?.value.trim() || '',
    ifsc: $('#regBankIfsc')?.value.trim() || ''
  };

  if (!name || name.length < 2) return toast('Please enter your name', 'warn');
  if (phone.length !== 10) return toast('Enter valid 10-digit phone', 'warn');
  if (!email.includes('@')) return toast('Enter valid email', 'warn');
  if (method === 'upi' && !upi) return toast('Enter your UPI ID', 'warn');
  if (method === 'bank' && (!bank.name || !bank.acc || !bank.ifsc)) return toast('Fill all bank details', 'warn');

  const btn = $('#regSubmitBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Creating account…'; }

  const payload = {
    uid: currentUser.uid, name, phone, email,
    payoutMethod: method, upiId: upi, bankDetails: bank,
    status: 'active',
    totalClicks: 0, totalSales: 0, totalEarnings: 0,
    availableBalance: 0, withdrawnAmount: 0,
    createdAt: serverTimestamp()
  };
  try {
    await setDoc(doc(db, 'affiliates', currentUser.uid), payload, { merge: true });
    affiliate = { ...payload, createdAt: new Date().toISOString() };
    toast('Welcome to the affiliate program! 🎉', 'success');
    startDashboardListeners();
    renderDashboard();
  } catch(e) {
    toast('Could not save: ' + e.message, 'warn');
    if (btn) { btn.disabled = false; btn.textContent = 'Join Affiliate Program'; }
  }
}

/* ─── REALTIME LISTENERS ─── */
function cleanupListeners() { _unsubs.forEach(u => { try { u(); } catch(e){} }); _unsubs = []; }

function startDashboardListeners() {
  const uid = currentUser.uid;

  // Live affiliate profile (clicks/sales/earnings update instantly)
  _unsubs.push(onSnapshot(doc(db, 'affiliates', uid), snap => {
    if (snap.exists()) { affiliate = snap.data(); if (document.getElementById('dashRoot')) renderDashboard(true); }
  }));

  // Earnings history
  try {
    const q = query(collection(db, 'affiliate_earnings'), where('affiliateUid','==',uid), orderBy('createdAt','desc'), limit(50));
    _unsubs.push(onSnapshot(q, snap => {
      earnings = snap.docs.map(d => ({ id:d.id, ...d.data() }));
      if (document.getElementById('earningsList')) renderEarningsList();
    }, () => {}));
  } catch(e) {}

  // Withdrawals history
  try {
    const q2 = query(collection(db, 'affiliate_withdrawals'), where('affiliateUid','==',uid), orderBy('createdAt','desc'), limit(20));
    _unsubs.push(onSnapshot(q2, snap => {
      withdrawals = snap.docs.map(d => ({ id:d.id, ...d.data() }));
      if (document.getElementById('withdrawList')) renderWithdrawList();
    }, () => {}));
  } catch(e) {}

  // Products (for link generator)
  try {
    const q3 = query(collection(db, 'products'), where('status','in',['active','approved','Active','Approved']));
    _unsubs.push(onSnapshot(q3, snap => {
      products = snap.docs.map(d => ({ id:d.id, ...d.data() })).filter(p => p.name);
      if (document.getElementById('prodList')) renderProductList();
    }, () => {}));
  } catch(e) {}
}

/* ─── RENDER: SPLASH OFF ─── */
function hideSplash() {
  const s = document.getElementById('splash');
  if (s) { s.classList.add('hidden'); setTimeout(()=>s.remove(), 450); }
}
setTimeout(() => { if (!currentUser && !document.getElementById('gateRoot')) hideSplash(); }, 1800);

/* ─── RENDER: GATE ─── */
function renderGate() {
  hideSplash();
  appEl.innerHTML = `
    <div id="gateRoot" class="gate-wrap">
      <div class="gate-badge">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
      </div>
      <div class="gate-title">Apykart Affiliate Program</div>
      <div class="gate-sub">Share any product link with friends & followers — earn real commission every time someone buys through your link.</div>
      <div class="gate-perks">
        <div class="gate-perk"><div class="gate-perk-icon">💰</div><div class="gate-perk-text">Earn ${Math.round(COMMISSION_RATE*100)}% commission on every sale</div></div>
        <div class="gate-perk"><div class="gate-perk-icon">🔗</div><div class="gate-perk-text">Get a unique link for any product in seconds</div></div>
        <div class="gate-perk"><div class="gate-perk-icon">📊</div><div class="gate-perk-text">Track clicks, sales & earnings in real time</div></div>
      </div>
      <button class="btn-google" id="gateSignIn">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09a5.99 5.99 0 0 1 0-4.18V7.07H2.18a10.98 10.98 0 0 0 0 9.86z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 3.04c.87-2.6 3.3-4.73 6.16-4.73z"/></svg>
        Sign in with Google
      </button>
      <div class="gate-note">Use the same Google account as your Apykart shopping account. Your name, phone & payout details are only used to pay your commissions.</div>
    </div>`;
  document.getElementById('gateSignIn').onclick = signIn;
}

  const email = currentUser.email || '';

    <div class="aff-header">
      <div class="aff-avatar">${photo?`<img src="${photo}">`:'👤'}</div>
      <div class="aff-header-title">Join Affiliate <span>Program</span></div>
      <div class="aff-signout" id="btnSignOut" title="Sign out">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </div>
    </div>
    <div class="form-wrap">
      <div class="form-hero">
        <div class="form-hero-title">One-time setup 🚀</div>
        <div class="form-hero-sub">Fill this once — then start sharing product links and track every rupee you earn.</div>
      </div>

      <div class="form-card">
        <div class="form-card-title">👤 Your Details</div>
        <div class="f-group"><label class="f-label">Full Name *</label><input class="f-input" id="regName" value="${name}" placeholder="Your full name"></div>
        <div class="f-group"><label class="f-label">Phone Number * (10 digits)</label><input class="f-input" id="regPhone" type="tel" maxlength="10" placeholder="9876543210"></div>
        <div class="f-group"><label class="f-label">Email *</label><input class="f-input" id="regEmail" type="email" value="${email}" placeholder="you@email.com"></div>
      </div>

      <div class="form-card">
        <div class="form-card-title">💳 How should we pay you?</div>
        <div class="pay-toggle">
          <div class="pay-toggle-btn active" id="payUpiBtn" onclick="window._setPayMethod('upi')">UPI</div>
          <div class="pay-toggle-btn" id="payBankBtn" onclick="window._setPayMethod('bank')">Bank Transfer</div>
        </div>
        <div id="payFieldsUpi">
          <div class="f-group"><label class="f-label">UPI ID *</label><input class="f-input" id="regUpi" placeholder="yourname@upi"></div>
        </div>
        <div id="payFieldsBank" style="display:none">
          <div class="f-group"><label class="f-label">Account Holder Name *</label><input class="f-input" id="regBankName" placeholder="As per bank records"></div>
          <div class="f-row">
            <div class="f-group"><label class="f-label">Account Number *</label><input class="f-input" id="regBankAcc" placeholder="0000000000"></div>
            <div class="f-group"><label class="f-label">IFSC Code *</label><input class="f-input" id="regBankIfsc" placeholder="ABCD0123456" style="text-transform:uppercase"></div>
          </div>
        </div>
      </div>

      <button class="btn-submit-form" id="regSubmitBtn">Join Affiliate Program</button>
      <div class="f-terms">By joining, you agree to promote products honestly. Commission (${Math.round(COMMISSION_RATE*100)}%) is credited once an order placed through your link is confirmed. Cancelled/returned orders don't earn commission.</div>
    </div>`;

  window._setPayMethod = (m) => {
    window._payMethod = m;
    $('#payUpiBtn').classList.toggle('active', m==='upi');
    $('#payBankBtn').classList.toggle('active', m==='bank');
    $('#payFieldsUpi').style.display = m==='upi' ? 'block':'none';
    $('#payFieldsBank').style.display = m==='bank' ? 'block':'none';

/* ─── RENDER: DASHBOARD ─── */
function renderDashboard(softUpdate) {
  hideSplash();
  const uid = currentUser.uid;
  const refLink = `${SITE_URL}?aff=${uid}`;
  const photo = currentUser.photoURL || '';
  const a = affiliate || {};
  const clicks = a.totalClicks || 0;
  const sales  = a.totalSales || 0;
  const convRate = clicks > 0 ? ((sales/clicks)*100).toFixed(1) : '0.0';

  if (!softUpdate) {
    appEl.innerHTML = `
      <div class="aff-header">
        <div class="aff-avatar">${photo?`<img src="${photo}">`:'👤'}</div>
        <div class="aff-header-title">Affiliate <span>Dashboard</span></div>
        <div class="aff-signout" id="btnSignOut2" title="Sign out">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </div>
      </div>
      <div id="dashRoot" class="dash"></div>`;
    document.getElementById('btnSignOut2').onclick = logout;
  }

  const root = document.getElementById('dashRoot');
  if (!root) return;
  root.innerHTML = `
    <div class="earn-hero">
      <div class="earn-hero-label">Available Balance</div>
      <div class="earn-hero-amt">₹${(a.availableBalance||0).toLocaleString()}</div>
      <div class="earn-hero-sub">Lifetime earnings: ₹${(a.totalEarnings||0).toLocaleString()} · Withdrawn: ₹${(a.withdrawnAmount||0).toLocaleString()}</div>
      <button class="earn-hero-btn" id="btnWithdraw">💸 Request Withdrawal</button>
    </div>

    <div class="stats-grid">
      <div class="stat-card"><div class="stat-val">${clicks}</div><div class="stat-label">Clicks</div></div>
      <div class="stat-card"><div class="stat-val">${sales}</div><div class="stat-label">Sales</div></div>
      <div class="stat-card"><div class="stat-val">${convRate}%</div><div class="stat-label">Conv. Rate</div></div>
    </div>

    <div class="ref-link-card">
      <div class="ref-link-title">🔗 Your Universal Referral Link</div>
      <div class="ref-link-box">
        <div class="ref-link-text">${refLink}</div>
        <button class="ref-link-copy" id="copyRefLink">Copy</button>
      </div>
      <div class="ref-share-row">
        <button class="ref-share-btn" style="background:#dcfce7;color:#166534" id="shareWhatsapp">📱 WhatsApp</button>
        <button class="ref-share-btn" style="background:var(--primary-light);color:var(--primary)" id="shareGeneric">🔗 Share</button>
      </div>
    </div>

    <div class="section-h">🛍️ Get a Link for Any Product</div>
    <input class="prod-search" id="prodSearchInput" placeholder="Search products to share…">
    <div id="prodList"></div>

    <div class="section-h">💰 Recent Earnings</div>
    <div id="earningsList"></div>

    <div class="section-h">🏦 Withdrawal History</div>
    <div id="withdrawList"></div>

    <div class="info-note">
      <div class="info-note-title">💡 How commissions work</div>
      <div class="info-note-body">You earn <strong>${Math.round(COMMISSION_RATE*100)}% of the order value</strong> whenever someone buys using your link — for any product, not just the one you shared. Commission shows as <strong>Pending</strong> until the order is delivered, then becomes <strong>available to withdraw</strong>.</div>
    </div>`;

  document.getElementById('copyRefLink').onclick = () => copyText(refLink, 'Referral link copied! 🔗');
  document.getElementById('shareWhatsapp').onclick = () => shareRef(refLink, true);
  document.getElementById('shareGeneric').onclick = () => shareRef(refLink, false);
  document.getElementById('btnWithdraw').onclick = openWithdrawModal;
  document.getElementById('prodSearchInput').oninput = (e) => renderProductList(e.target.value);

  renderProductList();
  renderEarningsList();
  renderWithdrawList();
}

function copyText(text, msg) {
  navigator.clipboard?.writeText(text).then(()=>toast(msg,'success')).catch(()=>{
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch(e){}
    document.body.removeChild(ta);
    toast(msg,'success');
  });
}
function shareRef(link, whatsapp) {
  const text = `🛒 Shop on *Apykart* using my link and I earn a small reward when you order — thanks for the support! 🙌\n\n${link}`;
  if (whatsapp) { window.open('https://wa.me/?text='+encodeURIComponent(text), '_blank'); return; }
  if (navigator.share) { navigator.share({ title:'Apykart', text, url: link }).catch(()=>{}); }
  else copyText(link, 'Link copied! 🔗');
}

/* ─── PRODUCT LINK GENERATOR ─── */
function renderProductList(q) {
  const el = document.getElementById('prodList');
  if (!el) return;
  const uid = currentUser.uid;
  let list = products;
  if (q && q.trim()) {
    const s = q.trim().toLowerCase();
    list = products.filter(p => (p.name||'').toLowerCase().includes(s) || (p.brand||'').toLowerCase().includes(s));
  }
  if (!list.length) {
    el.innerHTML = `<div class="empty-box"><div class="empty-icon">🔎</div><div class="empty-title">${products.length? 'No matching products':'Loading products…'}</div><div class="empty-sub">${products.length? 'Try a different search term':'Please wait a moment'}</div></div>`;
    return;
  }
  el.innerHTML = list.slice(0, 30).map(p => {
    const img = (Array.isArray(p.images) && p.images[0]) || p.img || '';
    const price = Number(p.price) || 0;
    const commission = Math.round(price * COMMISSION_RATE);
    const link = `${SITE_URL}?product=${p.id}&aff=${uid}`;
    return `<div class="prod-row">
      <div class="prod-thumb">${img?`<img src="${img}" onerror="this.parentElement.textContent='📦'">`:'📦'}</div>
      <div class="prod-info">
        <div class="prod-name">${p.name}</div>
        <div class="prod-price">₹${price.toLocaleString()}</div>
        <div class="prod-commission">You earn ~₹${commission} per sale</div>
      </div>
      <button class="prod-link-btn" data-link="${link.replace(/"/g,'&quot;')}">Get Link</button>
    </div>`;
  }).join('');
  el.querySelectorAll('.prod-link-btn').forEach(btn => {
    btn.onclick = () => copyText(btn.dataset.link, 'Product link copied! Share it anywhere 🚀');
  });
}

/* ─── EARNINGS LIST ─── */
function renderEarningsList() {
  const el = document.getElementById('earningsList');
  if (!el) return;
  if (!earnings.length) {
    el.innerHTML = `<div class="empty-box"><div class="empty-icon">💤</div><div class="empty-title">No earnings yet</div><div class="empty-sub">Share your link — your first commission will show up here.</div></div>`;
    return;
  }
  el.innerHTML = earnings.map(e => {
    const d = e.date ? new Date(e.date).toLocaleDateString('en-IN',{day:'numeric',month:'short'}) : '';
    const paid = e.status === 'paid';
    return `<div class="earn-item">
      <div class="earn-item-icon">🛒</div>
      <div class="earn-item-info">
        <div class="earn-item-title">Order #${e.orderId||'—'}</div>
        <div class="earn-item-sub">${d} · Order value ₹${(e.orderTotal||0).toLocaleString()}</div>
      </div>
      <div style="text-align:right">
        <div class="earn-item-amt">+₹${e.commission||0}</div>
        <span class="pill ${paid?'pill-paid':'pill-pending'}">${paid?'Paid':'Pending'}</span>
      </div>
    </div>`;
  }).join('');
}

/* ─── WITHDRAWAL LIST + MODAL ─── */
function renderWithdrawList() {
  const el = document.getElementById('withdrawList');
  if (!el) return;
  if (!withdrawals.length) {
    el.innerHTML = `<div class="empty-box"><div class="empty-icon">🏦</div><div class="empty-title">No withdrawal requests</div><div class="empty-sub">Request a payout once you have available balance.</div></div>`;
    return;
  }
  el.innerHTML = withdrawals.map(w => {
    const d = w.createdAt?.seconds ? new Date(w.createdAt.seconds*1000).toLocaleDateString('en-IN',{day:'numeric',month:'short'}) : '';
    const statusPill = w.status === 'paid' ? 'pill-paid' : 'pill-pending';
    return `<div class="earn-item">
      <div class="earn-item-icon">💸</div>
      <div class="earn-item-info">
        <div class="earn-item-title">Withdrawal request</div>
        <div class="earn-item-sub">${d} · ${w.method==='bank'?'Bank Transfer':'UPI'}</div>
      </div>
      <div style="text-align:right">
        <div class="earn-item-amt">₹${w.amount||0}</div>
        <span class="pill ${statusPill}">${w.status==='paid'?'Paid':'Pending'}</span>
      </div>
    </div>`;
  }).join('');
}

function openWithdrawModal() {
  const avail = affiliate?.availableBalance || 0;
  document.getElementById('modalRoot').innerHTML = `
  <div class="modal-overlay" id="wdOverlay">
    <div class="modal-sheet" onclick="event.stopPropagation()">
      <div class="modal-handle"></div>
      <div class="modal-head"><div class="modal-title">Request Withdrawal</div><div class="modal-close" id="wdClose">✕</div></div>
      <div class="modal-body">
        <div style="font-size:12.5px;color:var(--text2);margin-bottom:14px">Available balance: <strong style="color:var(--money-dark)">₹${avail.toLocaleString()}</strong></div>
        <div class="f-group"><label class="f-label">Amount to Withdraw *</label><input class="f-input" id="wdAmount" type="number" min="1" max="${avail}" placeholder="e.g. 500"></div>
        <div class="f-group"><label class="f-label">Payout to</label><input class="f-input" disabled value="${affiliate.payoutMethod==='bank' ? 'Bank · '+(affiliate.bankDetails?.acc||'') : 'UPI · '+(affiliate.upiId||'')}" style="color:var(--text3)"></div>
        <button class="withdraw-btn" id="wdSubmit">Submit Request</button>
        <div class="f-terms">Withdrawals are processed manually by the Apykart team, typically within 3–5 business days.</div>
      </div>
    </div>
  </div>`;
  document.getElementById('wdOverlay').onclick = closeModal;
  document.getElementById('wdClose').onclick = closeModal;
  document.getElementById('wdSubmit').onclick = submitWithdrawal;
}
function closeModal() { document.getElementById('modalRoot').innerHTML = ''; }

async function submitWithdrawal() {
  const avail = affiliate?.availableBalance || 0;
  const amt = Number(document.getElementById('wdAmount')?.value || 0);
  if (!amt || amt <= 0) return toast('Enter a valid amount', 'warn');
  if (amt > avail) return toast('Amount exceeds available balance', 'warn');

  const btn = document.getElementById('wdSubmit');
  if (btn) { btn.disabled = true; btn.textContent = 'Submitting…'; }
  try {
    await addDoc(collection(db, 'affiliate_withdrawals'), {
      affiliateUid: currentUser.uid,
      amount: amt,
      method: affiliate.payoutMethod || 'upi',
      payoutDetails: affiliate.payoutMethod==='bank' ? affiliate.bankDetails : { upiId: affiliate.upiId },
      status: 'pending',
      createdAt: serverTimestamp()
    });
    await updateDoc(doc(db, 'affiliates', currentUser.uid), { availableBalance: increment(-amt) });
    toast('Withdrawal requested ✅', 'success');
    closeModal();
  } catch(e) {
    toast('Failed: ' + e.message, 'warn');
    if (btn) { btn.disabled = false; btn.textContent = 'Submit Request'; }
  }
}
</script>
